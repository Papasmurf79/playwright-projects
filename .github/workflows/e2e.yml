# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
name: Playwright E2E Test
on: [push]
jobs:
  playwright-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 🔍 Validate playwright-extra plugins are installed
      # (Fails fast if someone removes them from package.json)
      - name: Verify Playwright Extra plugins
        run: |
          node -e "require('playwright-extra')"
          node -e "require('playwright-extra-plugin-stealth')"
          node -e "require('playwright-extra-plugin-recaptcha')"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run ESLint
        run: npx eslint . --ext .ts

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
